<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yur Shack — Websites &amp; Hosting</title>
  <meta name="description" content="Yur Shack builds and hosts websites for small businesses. Coming soon.">
  <meta name="robots" content="noindex,follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c1914;
      --muted: #5c564c;
      --paper: #f3eee4;
      --accent: #2f6b4f;
      --accent-soft: #d7e6dc;
      --wood: #8b5e3c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, rgba(47, 107, 79, 0.12), transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 100%, rgba(139, 94, 60, 0.14), transparent 50%),
        linear-gradient(165deg, #f7f2e8 0%, #e8dfd0 100%);
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 2.5rem 1.25rem;
    }

    .panel {
      width: min(36rem, 100%);
      text-align: center;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3.25rem;
      height: 3.25rem;
      margin-bottom: 1.25rem;
      border-radius: 0.85rem;
      background: var(--accent);
      color: #f7faf7;
      font-family: Fraunces, Georgia, serif;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
      box-shadow: 0 10px 28px rgba(47, 107, 79, 0.28);
    }

    h1 {
      margin: 0 0 0.65rem;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(2.4rem, 7vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }

    .tag {
      display: inline-block;
      margin-bottom: 1.25rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    p {
      margin: 0 auto 1.75rem;
      max-width: 28rem;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.55;
    }

    footer {
      padding: 1rem 1.25rem 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <div class="mark" aria-hidden="true">Y</div>
      <div class="tag">Coming soon</div>
      <h1>Yur Shack</h1>
      <p>Websites and hosting for small businesses. We design, build, and keep sites running — a new offering, launching shortly.</p>
    </div>
  </main>
  <footer>
    &copy; <span id="y">2026</span> Yur Shack
  </footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
