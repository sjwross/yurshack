name: Deploy GitHub Pages

# Publishes a static HTML export of the marketing site to
# https://sjwross.github.io/yurshack/
# PHP forms/admin still require the projtoolbox.com host (./deploy.sh).

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'yurshack.com/**'
      - 'scripts/build-static-pages.php'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build static Pages site
        run: php scripts/build-static-pages.php _pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
